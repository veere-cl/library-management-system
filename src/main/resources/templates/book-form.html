<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Book form</title></head><body><div th:replace="~{fragments :: nav}"></div><main class="container form-wrap"><h1 class="h3 mb-4" th:text="${book.id == null ? 'Add book' : 'Edit book'}"></h1><form method="post" th:action="@{/books/save}" th:object="${book}" class="card p-4" data-validate><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Title *</label><input class="form-control" th:field="*{title}" required></div><div class="col-md-6"><label class="form-label">Author *</label><input class="form-control" th:field="*{author}" required></div><div class="col-md-6"><label class="form-label">ISBN *</label><input class="form-control" th:field="*{isbn}" required></div><div class="col-md-6"><label class="form-label">Category *</label><input class="form-control" th:field="*{category}" required></div><div class="col-md-6"><label class="form-label">Publisher</label><input class="form-control" th:field="*{publisher}"></div><div class="col-md-6"><label class="form-label">Publication year</label><input class="form-control" type="number" min="1450" max="2200" th:field="*{publicationYear}"></div><div class="col-md-4"><label class="form-label">Total copies *</label><input class="form-control" type="number" min="1" th:field="*{totalCopies}" required></div><div class="col-md-4"><label class="form-label">Available copies *</label><input class="form-control" type="number" min="0" th:field="*{availableCopies}" required></div><div class="col-md-4"><label class="form-label">Shelf location</label><input class="form-control" th:field="*{shelfLocation}"></div></div><div class="mt-4"><button class="btn btn-primary">Save book</button> <a class="btn btn-outline-secondary" href="/books">Cancel</a></div></form></main><script src="/js/app.js"></script></body></html>
