<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Librarian Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body class="login-bg"><div class="card login-card shadow"><div class="card-body p-4"><h2 class="mb-1">📚 LibraryDesk</h2><p class="text-secondary mb-4">Librarian sign in</p><div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div><div th:if="${param.logout}" class="alert alert-success">You have logged out.</div><form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required></div><button class="btn btn-primary w-100">Sign in</button></form><small class="text-secondary d-block mt-3">Local default: librarian / ChangeMe123! (change before use)</small></div></div></body></html>
