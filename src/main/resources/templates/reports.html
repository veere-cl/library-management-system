<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Reports</title></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><h1 class="h3 mb-3">Reports and borrowing history</h1><div class="row g-3 mb-4"><div class="col-md-6"><div class="stat"><span>All borrowing records</span><strong th:text="${#lists.size(records)}">0</strong></div></div><div class="col-md-6"><div class="stat danger"><span>Currently overdue</span><strong th:text="${#lists.size(overdue)}">0</strong></div></div></div><div class="card"><div class="card-header bg-white fw-semibold">Borrowing history</div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Book</th><th>Member</th><th>Issue date</th><th>Due date</th><th>Return date</th><th>Status</th><th>Fine</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.book.title}"></td><td th:text="${r.member.fullName}"></td><td th:text="${r.issueDate}"></td><td th:text="${r.dueDate}"></td><td th:text="${r.returnDate == null ? '—' : r.returnDate}"></td><td th:text="${r.status}"></td><td th:text="${r.fine}"></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="7" class="text-center p-4 text-secondary">No records yet.</td></tr></tbody></table></div></div></main></body></html>
