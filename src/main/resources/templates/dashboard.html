<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Dashboard</title></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3">Dashboard</h1><p class="text-secondary">Your library at a glance</p></div><span class="text-secondary" th:text="${#temporals.format(#temporals.createToday(),'dd MMM yyyy')}"></span></div><div class="row g-3 mb-4"><div class="col-6 col-lg"><div class="stat"><span>Total book titles</span><strong th:text="${bookCount}">0</strong></div></div><div class="col-6 col-lg"><div class="stat"><span>Members</span><strong th:text="${memberCount}">0</strong></div></div><div class="col-6 col-lg"><div class="stat"><span>Issued</span><strong th:text="${issuedCount}">0</strong></div></div><div class="col-6 col-lg"><div class="stat"><span>Available copies</span><strong th:text="${availableCount}">0</strong></div></div><div class="col-6 col-lg"><div class="stat danger"><span>Overdue</span><strong th:text="${overdueCount}">0</strong></div></div></div><div class="card"><div class="card-header bg-white fw-semibold">Recent borrowing activity</div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${recent}"><td th:text="${r.book.title}"></td><td th:text="${r.member.fullName}"></td><td th:text="${r.issueDate}"></td><td th:text="${r.dueDate}"></td><td><span class="badge" th:classappend="${r.status == 'ISSUED' ? ' text-bg-primary' : ' text-bg-success'}" th:text="${r.status}"></span></td></tr><tr th:if="${#lists.isEmpty(recent)}"><td colspan="5" class="text-center text-secondary p-4">No borrowing activity yet.</td></tr></tbody></table></div></div></main></body></html>
