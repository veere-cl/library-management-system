<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Member form</title></head><body><div th:replace="~{fragments :: nav}"></div><main class="container form-wrap"><h1 class="h3 mb-4" th:text="${member.id == null ? 'Register member' : 'Edit member'}"></h1><form method="post" th:action="@{/members/save}" th:object="${member}" class="card p-4" data-validate><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" th:field="*{fullName}" required></div><div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" th:field="*{email}" required></div><div class="col-md-6"><label class="form-label">Phone *</label><input class="form-control" th:field="*{phone}" required></div><div class="col-md-6"><label class="form-label">Registration date</label><input class="form-control" type="date" th:field="*{registrationDate}"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" th:field="*{address}" rows="2"></textarea></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Membership active</label></div></div><div class="mt-4"><button class="btn btn-primary">Save member</button> <a class="btn btn-outline-secondary" href="/members">Cancel</a></div></form></main><script src="/js/app.js"></script></body></html>
