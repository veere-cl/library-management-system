<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Members</title></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Member management</h1><a class="btn btn-primary" href="/members/new">+ Register member</a></div><form class="row g-2 mb-3"><div class="col-sm-8"><input class="form-control" name="q" th:value="${q}" placeholder="Search name or email"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button></div></form><div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="m : ${members}"><td th:text="${m.fullName}"></td><td th:text="${m.email}"></td><td th:text="${m.phone}"></td><td th:text="${m.registrationDate}"></td><td><span class="badge" th:classappend="${m.active?'text-bg-success':'text-bg-secondary'}" th:text="${m.active?'Active':'Inactive'}"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/members/{id}/edit(id=${m.id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/members/{id}/delete(id=${m.id})}" onsubmit="return confirm('Delete this member?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(members)}"><td colspan="6" class="text-center p-4 text-secondary">No members found.</td></tr></tbody></table></div></div></main></body></html>
