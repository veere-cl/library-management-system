<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Issue and return</title></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><h1 class="h3 mb-3">Issue and return books</h1><div th:if="${param.issued}" class="alert alert-success">Book issued successfully.</div><div th:if="${param.returned}" class="alert alert-success">Book returned successfully.</div><div class="card p-4 mb-4"><h2 class="h5">Issue a book</h2><form method="post" th:action="@{/borrow/issue}" class="row g-3"><div class="col-md-5"><label class="form-label">Available book</label><select class="form-select" name="bookId" required><option value="">Choose book</option><option th:each="b : ${books}" th:if="${b.availableCopies > 0}" th:value="${b.id}" th:text="${b.title + ' — ' + b.author + ' (' + b.availableCopies + ' available)'}"></option></select></div><div class="col-md-5"><label class="form-label">Active member</label><select class="form-select" name="memberId" required><option value="">Choose member</option><option th:each="m : ${members}" th:if="${m.active}" th:value="${m.id}" th:text="${m.fullName + ' — ' + m.email}"></option></select></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Issue</button></div><div class="col-12 text-secondary small">Due date is set automatically using the configured borrowing period.</div></form></div><div class="card"><div class="card-header bg-white fw-semibold">Currently issued books</div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Book</th><th>Member</th><th>Issue date</th><th>Due date</th><th>State</th><th></th></tr></thead><tbody><tr th:each="r : ${issued}"><td th:text="${r.book.title}"></td><td th:text="${r.member.fullName}"></td><td th:text="${r.issueDate}"></td><td th:text="${r.dueDate}"></td><td><span class="badge" th:classappend="${r.dueDate.isBefore(T(java.time.LocalDate).now())?'text-bg-danger':'text-bg-primary'}" th:text="${r.dueDate.isBefore(T(java.time.LocalDate).now())?'Overdue':'Issued'}"></span></td><td><form method="post" th:action="@{/borrow/{id}/return(id=${r.id})}" onsubmit="return confirm('Record this return?')"><button class="btn btn-sm btn-success">Return</button></form></td></tr><tr th:if="${#lists.isEmpty(issued)}"><td colspan="6" class="text-center p-4 text-secondary">No books are currently issued.</td></tr></tbody></table></div></div></main></body></html>
