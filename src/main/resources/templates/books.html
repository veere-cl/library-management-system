<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Books</title></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Book management</h1><a class="btn btn-primary" href="/books/new">+ Add book</a></div><form class="row g-2 mb-3"><div class="col-sm-8"><input class="form-control" name="q" th:value="${q}" placeholder="Search title, author, ISBN or category"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button></div></form><div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Copies</th><th>Shelf</th><th>Actions</th></tr></thead><tbody><tr th:each="b : ${books}"><td th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.isbn}"></td><td th:text="${b.category}"></td><td><span th:text="${b.availableCopies}"></span> / <span th:text="${b.totalCopies}"></span></td><td th:text="${b.shelfLocation}"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/books/{id}/edit(id=${b.id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/books/{id}/delete(id=${b.id})}" onsubmit="return confirm('Delete this book?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(books)}"><td colspan="7" class="text-center p-4 text-secondary">No books found.</td></tr></tbody></table></div></div></main></body></html>
